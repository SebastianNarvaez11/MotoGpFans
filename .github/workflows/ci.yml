name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones anteriores de la misma rama: solo interesa la última.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest

    env:
      # Valores ficticios: el build no se conecta a la base de datos, pero la
      # validación de entorno (lib/env.ts) exige que las variables existan.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      INGEST_SECRET: ci-secret-de-relleno-con-mas-de-32-caracteres
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run db:generate

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Política en dos niveles, y no por comodidad: un CI que falla siempre
      # acaba ignorándose, que es peor que no tenerlo.
      #
      # Las críticas bloquean sin discusión.
      - name: Vulnerabilidades críticas (bloquea)
        run: npm audit --audit-level=critical

      # Las altas se publican para revisarlas, pero no bloquean. Hoy la única
      # es `deepmerge-ts` a través de la CLI de Prisma: se ejecuta solo al
      # construir y migrar, con nuestro propio archivo de configuración como
      # entrada, así que no hay forma de explotarla desde fuera. El arreglo
      # exigiría bajar Prisma a una versión incompatible con el proyecto.
      # Dependabot subirá la versión en cuanto exista una corregida.
      - name: Vulnerabilidades altas (informa)
        continue-on-error: true
        run: npm audit --audit-level=high
